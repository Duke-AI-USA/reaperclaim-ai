<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReaperClaimAI — Upload. Audit. Collect.</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:ital,wght@0,100;0,300;0,400;0,600;0,700;0,900;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --void: #020408;
  --deep: #040810;
  --surface: #070E18;
  --card: #0A1220;
  --border: #0E1E35;
  --border2: #152840;
  --ice: #00C8FF;
  --ice2: #0088CC;
  --red: #FF1A1A;
  --red-dim: rgba(255,26,26,0.15);
  --text: #C8E8F8;
  --text2: #E8F4FF;
  --muted: #3A5570;
  --muted2: #5A7890;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--void);color:var(--text);font-family:'Exo 2',sans-serif;overflow-x:hidden;}

p,.hero-sub,.s-sub,.pain-body,.feat-body,.plan-desc,.n-text,.form-note,.cta-sub,.f-txt {
  text-shadow:0 1px 12px rgba(0,0,0,0.95),0 0 30px rgba(0,0,0,0.8);
  color:var(--text2);
}
h1,h2,.s-title,.hero-title {
  text-shadow:0 0 40px rgba(0,0,0,1),0 2px 12px rgba(0,0,0,1),0 0 80px rgba(0,0,0,0.9);
}

/* Grid + Scan */
.grid-bg{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(0,200,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.025) 1px,transparent 1px);background-size:60px 60px;}
.scan{position:fixed;left:0;right:0;height:1px;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:0.15;animation:scanDown 12s linear infinite;}
@keyframes scanDown{from{top:0;}to{top:100vh;}}

/* Scanlines */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:1000;}

/* HUD corners */
.hud-tl,.hud-tr,.hud-bl,.hud-br{position:fixed;width:48px;height:48px;z-index:50;pointer-events:none;}
.hud-tl{top:20px;left:20px;border-top:1px solid var(--ice);border-left:1px solid var(--ice);}
.hud-tr{top:20px;right:20px;border-top:1px solid var(--ice);border-right:1px solid var(--ice);}
.hud-bl{bottom:20px;left:20px;border-bottom:1px solid var(--ice);border-left:1px solid var(--ice);}
.hud-br{bottom:20px;right:20px;border-bottom:1px solid var(--ice);border-right:1px solid var(--ice);}
.hud-tl::after{content:'RC-AI';position:absolute;top:6px;left:52px;font-family:'Share Tech Mono';font-size:9px;color:var(--muted2);letter-spacing:2px;white-space:nowrap;}
.hud-br::after{content:'v1.0 BETA';position:absolute;bottom:6px;right:52px;font-family:'Share Tech Mono';font-size:9px;color:var(--muted2);letter-spacing:2px;white-space:nowrap;}

/* Lightning */
.lightning{position:absolute;top:0;width:2px;background:linear-gradient(180deg,rgba(200,240,255,0.9),rgba(0,200,255,0.3),transparent);opacity:0;border-radius:2px;}
.l1{height:35vh;left:28%;animation:lBolt 7s 2s infinite;transform:rotate(-8deg);}
.l2{height:28vh;left:66%;animation:lBolt 9s 4.5s infinite;transform:rotate(12deg);}
.l3{height:22vh;left:18%;animation:lBolt 11s 1s infinite;transform:rotate(-15deg);}
.l4{height:30vh;left:76%;animation:lBolt 8s 6s infinite;transform:rotate(5deg);}
@keyframes lBolt{0%,88%,100%{opacity:0;}89%{opacity:1;}90%{opacity:0.3;}91%{opacity:0.9;}94%{opacity:0;}}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;background:rgba(0,200,255,0.04);opacity:0;animation:flashCycle 7s 2s infinite;}
@keyframes flashCycle{0%,88%,100%{opacity:0;}89%{opacity:1;}90%{opacity:0.2;}91%{opacity:0.6;}94%{opacity:0;}}

/* Reaper BG */
#reaper-jpg {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  height: auto;
  min-height: 100vh;
  object-fit: cover;
  object-position: center top;
  max-width: none;
  opacity: 0;
  animation: reaperAppear 2.5s ease 0.5s forwards;
}
@keyframes reaperAppear {
  0%   { opacity: 0; transform: translateX(-50%) translateY(20px); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0); }
}
#reaper-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#reaper-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,4,8,0.85) 0%,rgba(2,4,8,0.55) 30%,rgba(2,4,8,0.45) 55%,rgba(2,4,8,0.70) 80%,rgba(2,4,8,0.92) 100%);z-index:1;}
.storm-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(0,40,90,0.15) 0%,transparent 70%),radial-gradient(ellipse 80% 60% at 50% 75%,rgba(0,20,60,0.1) 0%,transparent 70%);animation:stormPulse 8s ease-in-out infinite;}
@keyframes stormPulse{0%,100%{opacity:1;}50%{opacity:0.65;}}
.reaper-glow{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:200px;background:radial-gradient(ellipse at 50% 100%,rgba(0,160,255,0.18) 0%,rgba(0,80,180,0.06) 50%,transparent 80%);border-radius:50%;animation:glowPulse 3s ease-in-out infinite;}
@keyframes glowPulse{0%,100%{opacity:0.8;}50%{opacity:1;}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:20px 48px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,4,8,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);}
nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:0.3;}
.logo{font-family:'Audiowide';font-size:18px;letter-spacing:2px;text-transform:uppercase;}
.logo .r{color:var(--text2);}
.logo .c{color:var(--ice);text-shadow:0 0 20px rgba(0,200,255,0.5);}
.logo .a{font-size:10px;color:var(--muted2);vertical-align:super;margin-left:2px;}
.nav-status{display:flex;align-items:center;gap:8px;font-family:'Share Tech Mono';font-size:10px;color:var(--muted);letter-spacing:1px;}
.ndot{width:6px;height:6px;border-radius:50%;background:var(--ice);box-shadow:0 0 8px var(--ice);animation:ndotPulse 2s ease infinite;}
@keyframes ndotPulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.nav-btn{position:relative;overflow:hidden;background:transparent;border:1px solid var(--ice);color:var(--ice);padding:10px 28px;font-family:'Audiowide';font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;transition:all 0.3s;cursor:pointer;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.nav-btn::before{content:'';position:absolute;inset:0;background:var(--ice);transform:translateX(-100%);transition:transform 0.3s ease;z-index:-1;}
.nav-btn:hover{color:var(--void);}
.nav-btn:hover::before{transform:translateX(0);}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px 100px;z-index:10;}

.classified{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(0,200,255,0.35);background:rgba(0,200,255,0.05);padding:8px 20px;margin-bottom:40px;font-family:'Share Tech Mono';font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ice);animation:fadeUp 0.6s ease both;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.classified-bar{width:20px;height:1px;background:var(--ice);}

.hero-title{font-family:'Audiowide';font-size:clamp(44px,9vw,108px);letter-spacing:4px;line-height:0.95;text-transform:uppercase;margin-bottom:16px;animation:fadeUp 0.6s 0.1s ease both;}
.title-line1{display:block;color:var(--text2);position:relative;}
.title-line1::before,.title-line1::after{content:attr(data-text);position:absolute;top:0;left:0;right:0;opacity:0;}
.title-line1::before{color:var(--ice);clip-path:polygon(0 0,100% 0,100% 35%,0 35%);animation:glitch1 4s infinite;}
.title-line1::after{color:var(--red);clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);animation:glitch2 4s infinite;}
@keyframes glitch1{0%,90%,100%{opacity:0;transform:translateX(0);}91%{opacity:0.8;transform:translateX(-4px);}93%{opacity:0;}95%{opacity:0.6;transform:translateX(4px);}97%{opacity:0;}}
@keyframes glitch2{0%,88%,100%{opacity:0;transform:translateX(0);}89%{opacity:0.6;transform:translateX(4px);}91%{opacity:0;}94%{opacity:0.4;transform:translateX(-3px);}96%{opacity:0;}}
.title-line2{display:block;color:transparent;-webkit-text-stroke:1px var(--ice);animation:strokePulse 3s ease infinite;}
@keyframes strokePulse{0%,100%{text-shadow:0 0 40px rgba(0,200,255,0.2);}50%{text-shadow:0 0 80px rgba(0,200,255,0.5);}}
.title-line3{display:block;background:linear-gradient(135deg,var(--ice) 0%,#FFF 40%,var(--ice2) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradFlow 3s linear infinite;}
@keyframes gradFlow{0%{background-position:0% center;}100%{background-position:200% center;}}

.hero-divider{width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--ice),transparent);margin:28px auto;animation:fadeUp 0.6s 0.15s ease both;}
.hero-sub{font-size:18px;color:var(--muted2);max-width:580px;line-height:1.7;margin:0 auto 48px;font-weight:300;animation:fadeUp 0.6s 0.2s ease both;}
.hero-sub strong{color:var(--text2);font-weight:600;}

/* Signup */
.signup-outer{width:100%;max-width:480px;position:relative;animation:fadeUp 0.6s 0.3s ease both;}
.hc{position:absolute;width:14px;height:14px;}
.hc-tl{top:-2px;left:-2px;border-top:1px solid var(--ice);border-left:1px solid var(--ice);}
.hc-tr{top:-2px;right:-2px;border-top:1px solid var(--ice);border-right:1px solid var(--ice);}
.hc-bl{bottom:-2px;left:-2px;border-bottom:1px solid var(--ice);border-left:1px solid var(--ice);}
.hc-br{bottom:-2px;right:-2px;border-bottom:1px solid var(--ice);border-right:1px solid var(--ice);}
.signup-box{background:var(--card);border:1px solid var(--border2);padding:32px;position:relative;overflow:hidden;}
.signup-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--ice),var(--ice2),var(--ice),transparent);background-size:200% 100%;animation:lineFlow 3s linear infinite;}
@keyframes lineFlow{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.signup-tag{font-family:'Share Tech Mono';font-size:10px;letter-spacing:2px;color:var(--ice);text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.signup-tag::before{content:'//';color:var(--muted);}
.input-stack{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
input,select{width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:13px 16px;font-family:'Exo 2';font-size:14px;outline:none;transition:all 0.25s;appearance:none;cursor:pointer;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
input:focus,select:focus{border-color:var(--ice);box-shadow:0 0 0 1px rgba(0,200,255,0.1);}
input::placeholder{color:var(--muted);font-style:italic;}
select option{background:var(--surface);}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:9px;}
.cta-btn{width:100%;position:relative;overflow:hidden;background:transparent;border:1px solid var(--ice);color:var(--ice);padding:16px;font-family:'Audiowide';font-size:12px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.cta-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ice),var(--ice2));transform:translateX(-100%);transition:transform 0.4s ease;z-index:-1;}
.cta-btn:hover{color:var(--void);box-shadow:0 0 40px rgba(0,200,255,0.4);}
.cta-btn:hover::before{transform:translateX(0);}
.form-note{text-align:center;font-family:'Share Tech Mono';font-size:10px;color:var(--muted);margin-top:12px;}
.success-state{display:none;text-align:center;padding:24px 0;}
.success-icon{font-size:56px;animation:iconPulse 2s ease infinite;margin-bottom:12px;}
@keyframes iconPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(0,200,255,0.4));}50%{filter:drop-shadow(0 0 24px rgba(0,200,255,0.9));}}
.success-title{font-family:'Audiowide';font-size:24px;letter-spacing:4px;text-transform:uppercase;color:var(--ice);margin-bottom:10px;}
.success-sub{font-size:14px;color:var(--muted2);line-height:1.6;font-weight:300;}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

/* Sections */
.section{position:relative;z-index:10;max-width:1160px;margin:0 auto;padding:110px 24px;}
hr.div{border:none;border-top:1px solid var(--border);position:relative;z-index:10;}
.s-eye{display:flex;align-items:center;gap:12px;font-family:'Share Tech Mono';font-size:10px;color:var(--ice);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;}
.s-eye::before{content:'//';color:var(--muted);}
.s-eye-line{flex:1;height:1px;background:linear-gradient(90deg,var(--ice),transparent);max-width:100px;opacity:0.3;}
.s-title{font-family:'Audiowide';font-size:clamp(30px,5vw,60px);letter-spacing:3px;line-height:1.0;text-transform:uppercase;margin-bottom:16px;}
.s-sub{font-size:17px;color:var(--muted2);max-width:580px;line-height:1.7;margin-bottom:56px;font-weight:300;}

/* Pain cards */
.pain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.pain-card{background:var(--card);border:1px solid var(--border);padding:28px;position:relative;overflow:hidden;transition:all 0.3s;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));}
.pain-card:hover{border-color:rgba(255,26,26,0.35);transform:translateY(-4px);}
.pain-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:linear-gradient(180deg,var(--red),transparent);}
.pain-card::after{content:'';position:absolute;top:0;right:0;width:16px;height:16px;background:var(--deep);border-bottom:1px solid var(--border);border-left:1px solid var(--border);}
.pain-num{font-family:'Share Tech Mono';font-size:10px;color:var(--red);letter-spacing:2px;margin-bottom:10px;opacity:0.7;}
.pain-title{font-weight:700;font-size:16px;margin-bottom:10px;color:var(--text2);}
.pain-body{font-size:14px;color:var(--muted2);line-height:1.6;font-weight:300;}

/* HOW IT WORKS — Steps */
.steps-wrap{display:flex;flex-direction:column;gap:0;position:relative;margin-top:40px;}
.steps-wrap::before{content:'';position:absolute;left:18px;top:24px;bottom:24px;width:1px;background:linear-gradient(to bottom,var(--ice),rgba(0,200,255,0.1));opacity:0.3;}
.step{display:flex;gap:28px;padding:20px 0;position:relative;}
.step-num{width:38px;height:38px;border:1px solid var(--ice);background:var(--void);display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono';font-size:11px;color:var(--ice);flex-shrink:0;z-index:1;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
.step-body{}
.step-title{font-family:'Audiowide';font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-bottom:6px;}
.step-desc{font-size:13px;color:var(--muted2);line-height:1.7;font-weight:300;}

/* UPLOAD ZONE */
.upload-zone{background:var(--card);border:1px dashed rgba(0,200,255,0.3);padding:52px 32px;text-align:center;position:relative;overflow:hidden;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));transition:all 0.3s;cursor:pointer;margin-top:40px;}
.upload-zone:hover{border-color:rgba(0,200,255,0.7);background:rgba(0,200,255,0.04);}
.upload-zone::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(0,200,255,0.03) 0%,transparent 60%);pointer-events:none;}
.upload-zone::after{content:'COMING SOON';position:absolute;top:0;right:0;font-family:'Share Tech Mono';font-size:9px;letter-spacing:2px;background:rgba(0,200,255,0.15);color:var(--ice);padding:4px 10px;border-left:1px solid rgba(0,200,255,0.3);border-bottom:1px solid rgba(0,200,255,0.3);}
.upload-icon{font-size:48px;margin-bottom:16px;filter:drop-shadow(0 0 12px rgba(0,200,255,0.5));animation:iconPulse 3s ease infinite;}
.upload-headline{font-family:'Audiowide';font-size:clamp(16px,3vw,24px);letter-spacing:3px;text-transform:uppercase;color:var(--text2);margin-bottom:10px;}
.upload-sub{font-family:'Share Tech Mono';font-size:11px;color:var(--muted2);letter-spacing:1px;line-height:1.8;}
.upload-formats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.fmt-tag{font-family:'Share Tech Mono';font-size:9px;letter-spacing:2px;color:var(--muted);border:1px solid var(--border2);padding:4px 10px;text-transform:uppercase;}

/* Features */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.feat-card{background:var(--card);border:1px solid var(--border);padding:28px;position:relative;overflow:hidden;transition:all 0.3s;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}
.feat-card:hover{border-color:rgba(0,200,255,0.3);transform:translateY(-4px);}
.feat-card::after{content:'';position:absolute;top:0;right:0;width:14px;height:14px;background:var(--deep);border-bottom:1px solid var(--border);border-left:1px solid var(--border);}
.feat-icon{font-size:28px;margin-bottom:12px;}
.feat-title{font-family:'Audiowide';font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;color:var(--text2);}
.feat-body{font-size:13px;color:var(--muted2);line-height:1.7;font-weight:300;}

/* Pricing */
.model-wrap{max-width:620px;margin:0 auto 56px;}
.model-card{background:var(--card);border:1px solid rgba(0,200,255,0.3);position:relative;overflow:hidden;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));}
.model-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(0,200,255,0.06) 0%,transparent 60%);pointer-events:none;}
.model-top{padding:36px 40px 24px;text-align:center;}
.model-free{font-family:'Audiowide';font-size:clamp(80px,22vw,120px);color:var(--ice);letter-spacing:12px;text-shadow:0 0 60px rgba(0,200,255,0.7),0 0 120px rgba(0,200,255,0.3);line-height:1;margin-bottom:8px;animation:freePulse 3s ease-in-out infinite;}
@keyframes freePulse{0%,100%{text-shadow:0 0 60px rgba(0,200,255,0.7),0 0 120px rgba(0,200,255,0.3);}50%{text-shadow:0 0 80px rgba(0,200,255,1),0 0 160px rgba(0,200,255,0.5);}}
.model-tag{font-family:'Share Tech Mono';font-size:11px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;}
.model-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:0 24px;}
.model-math{padding:28px 40px;display:flex;flex-direction:column;gap:14px;}
.model-math-row{display:flex;justify-content:space-between;align-items:center;}
.mm-label{font-family:'Share Tech Mono';font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.mm-val{font-family:'Audiowide';font-size:22px;letter-spacing:1px;}
.model-feats{padding:28px 40px;display:flex;flex-direction:column;gap:12px;}
.mf-item{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--text2);line-height:1.5;}
.mf-icon{color:var(--ice);font-family:'Share Tech Mono';flex-shrink:0;margin-top:1px;}
.model-cta-wrap{padding:24px 40px 36px;text-align:center;}
.model-cta{display:inline-block;padding:18px 48px;font-family:'Audiowide';font-size:13px;letter-spacing:3px;color:var(--void);background:linear-gradient(135deg,var(--ice),var(--ice2));text-decoration:none;cursor:pointer;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);text-transform:uppercase;}
.model-cta:hover{box-shadow:0 0 40px rgba(0,200,255,0.5);transform:translateY(-2px);}

/* Soul quote */
.soul-quote{position:relative;z-index:10;padding:80px 24px;text-align:center;overflow:hidden;}
.soul-quote::before{content:'☠';position:absolute;font-size:400px;color:rgba(0,200,255,0.02);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;line-height:1;}
.soul-quote-text{font-family:'Audiowide';font-size:clamp(18px,4vw,42px);letter-spacing:3px;text-transform:uppercase;line-height:1.2;color:var(--text2);max-width:900px;margin:0 auto 24px;position:relative;}
.soul-quote-text .ice{color:var(--ice);text-shadow:0 0 30px rgba(0,200,255,0.5);}
.soul-quote-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--ice),transparent);margin:20px auto;opacity:0.4;}
.soul-quote-attr{font-family:'Share Tech Mono';font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}

/* CTA */
.cta-wrap{padding:100px 24px;text-align:center;position:relative;z-index:10;}
.cta-inner{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--border2);padding:72px 48px;position:relative;overflow:hidden;clip-path:polygon(0 0,calc(100% - 32px) 0,100% 32px,100% 100%,32px 100%,0 calc(100% - 32px));}
.cta-inner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,rgba(0,200,255,0.05) 0%,transparent 60%);pointer-events:none;}
.cta-title{font-family:'Audiowide';font-size:clamp(26px,5vw,50px);letter-spacing:3px;text-transform:uppercase;line-height:1.0;margin-bottom:16px;}
.cta-title .ice{color:var(--ice);text-shadow:0 0 30px rgba(0,200,255,0.4);}
.cta-sub{font-size:16px;color:var(--muted2);max-width:480px;margin:0 auto 40px;line-height:1.7;font-weight:300;}
.cta-link{display:inline-block;padding:18px 48px;font-family:'Audiowide';font-size:13px;letter-spacing:3px;color:var(--ice);border:1px solid var(--ice);background:transparent;cursor:pointer;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);text-decoration:none;}
.cta-link:hover{background:var(--ice);color:var(--void);box-shadow:0 0 40px rgba(0,200,255,0.4);}

/* Footer */
footer{border-top:1px solid var(--border);padding:32px 48px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative;z-index:10;background:var(--deep);}
footer::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:0.15;}
.f-logo{font-family:'Audiowide';font-size:15px;letter-spacing:2px;text-transform:uppercase;}
.f-logo .r{color:var(--text2);}
.f-logo .c{color:var(--ice);}
.f-links{display:flex;gap:24px;flex-wrap:wrap;}
.f-link{font-family:'Share Tech Mono';font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-decoration:none;transition:color 0.2s;}
.f-link:hover{color:var(--ice);}
.f-legal{width:100%;font-family:'Share Tech Mono';font-size:9px;color:var(--muted);letter-spacing:1px;line-height:1.9;padding-top:16px;border-top:1px solid var(--border);text-align:center;}

/* Reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.6s ease,transform 0.6s ease;}
.reveal.in{opacity:1;transform:translateY(0);}

/* Chat widget */
#reaper-chat-btn{position:fixed;bottom:32px;right:32px;z-index:1000;width:64px;height:64px;background:var(--void);border:1px solid var(--ice);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 20px rgba(0,200,255,0.3),0 0 40px rgba(0,200,255,0.1);transition:all 0.3s;animation:reaperBtnPulse 3s ease-in-out infinite;}
#reaper-chat-btn:hover{box-shadow:0 0 30px rgba(0,200,255,0.6),0 0 60px rgba(0,200,255,0.2);transform:scale(1.08);}
@keyframes reaperBtnPulse{0%,100%{box-shadow:0 0 20px rgba(0,200,255,0.3),0 0 40px rgba(0,200,255,0.1);}50%{box-shadow:0 0 30px rgba(0,200,255,0.5),0 0 60px rgba(0,200,255,0.15);}}
.reaper-btn-icon{font-size:28px;line-height:1;animation:skullPulse 2s ease-in-out infinite;}
@keyframes skullPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.reaper-chat-badge{position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:var(--ice);border-radius:50%;border:2px solid var(--void);animation:ndotPulse 2s ease infinite;}

#reaper-chat-window{position:fixed;bottom:108px;right:32px;z-index:1000;width:360px;max-height:560px;background:var(--void);border:1px solid rgba(0,200,255,0.3);display:flex;flex-direction:column;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));box-shadow:0 0 40px rgba(0,200,255,0.15),0 20px 60px rgba(0,0,0,0.8);transform:translateY(20px);opacity:0;pointer-events:none;transition:all 0.3s ease;}
#reaper-chat-window.open{transform:translateY(0);opacity:1;pointer-events:all;}
.chat-header{padding:16px 20px;border-bottom:1px solid rgba(0,200,255,0.15);display:flex;align-items:center;gap:12px;background:rgba(0,200,255,0.04);flex-shrink:0;}
.chat-header-icon{font-size:22px;filter:drop-shadow(0 0 8px rgba(0,200,255,0.8));}
.chat-header-info{flex:1;}
.chat-header-name{font-family:'Audiowide';font-size:12px;letter-spacing:2px;color:var(--ice);text-transform:uppercase;}
.chat-header-status{display:flex;align-items:center;gap:6px;margin-top:3px;font-family:'Share Tech Mono';font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.chat-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;transition:color 0.2s;line-height:1;}
.chat-close:hover{color:var(--ice);}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.chat-msg{display:flex;flex-direction:column;gap:4px;max-width:88%;animation:msgIn 0.3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.chat-msg.reaper{align-self:flex-start;}
.chat-msg.user{align-self:flex-end;}
.chat-bubble{padding:10px 14px;font-size:13px;line-height:1.6;font-family:'Exo 2';font-weight:300;}
.chat-msg.reaper .chat-bubble{background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.2);color:var(--text2);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);}
.chat-msg.user .chat-bubble{background:rgba(0,200,255,0.12);border:1px solid rgba(0,200,255,0.3);color:var(--text2);clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);}
.chat-sender{font-family:'Share Tech Mono';font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.chat-msg.reaper .chat-sender{color:var(--ice);opacity:0.6;}
.chat-typing{display:flex;align-items:center;gap:4px;padding:10px 14px;background:rgba(0,200,255,0.06);border:1px solid rgba(0,200,255,0.2);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);width:fit-content;}
.typing-dot{width:5px;height:5px;background:var(--ice);border-radius:50%;animation:typingBounce 1.2s ease infinite;}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-6px);opacity:1;}}
.chat-input-wrap{padding:12px 16px;border-top:1px solid rgba(0,200,255,0.15);display:flex;gap:10px;align-items:center;flex-shrink:0;background:rgba(0,0,0,0.3);}
#reaper-chat-input{flex:1;background:rgba(0,200,255,0.05);border:1px solid rgba(0,200,255,0.2);color:var(--text2);padding:10px 14px;font-family:'Exo 2';font-size:13px;outline:none;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);transition:border-color 0.2s;}
#reaper-chat-input:focus{border-color:rgba(0,200,255,0.5);}
#reaper-chat-input::placeholder{color:var(--muted);font-style:italic;}
#reaper-send-btn{background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.3);color:var(--ice);width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);transition:all 0.2s;font-size:14px;flex-shrink:0;}
#reaper-send-btn:hover{background:rgba(0,200,255,0.2);border-color:var(--ice);}
#reaper-send-btn:disabled{opacity:0.4;cursor:not-allowed;}

@media(max-width:768px){
  nav{padding:14px 20px;}
  .nav-status{display:none;}
  .cta-inner{padding:40px 20px;}
  footer{padding:24px 20px;}
  .hud-tl,.hud-tr,.hud-bl,.hud-br{display:none;}
  #reaper-chat-window{width:calc(100vw - 32px);right:16px;bottom:96px;}
  #reaper-chat-btn{right:16px;bottom:20px;}
  .model-top,.model-math,.model-feats,.model-cta-wrap{padding-left:20px;padding-right:20px;}
}

/* GALATIANS BANNER */
.galatians-banner {
  position: relative;
  z-index: 150;
  background: rgba(2,0,0,0.97);
  border-bottom: 1px solid rgba(255,26,26,0.4);
  border-top: 1px solid rgba(255,26,26,0.2);
  padding: 13px 24px;
  text-align: center;
  margin-top: 61px;
  overflow: hidden;
}
.galatians-banner::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,26,26,0.9), transparent);
  animation: redLine 3s linear infinite;
}
.galatians-banner::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,26,26,0.5), transparent);
}
@keyframes redLine {
  0% { background-position: -200% 0; opacity: 0.6; }
  50% { opacity: 1; }
  100% { background-position: 200% 0; opacity: 0.6; }
}
.galatians-text {
  font-family: 'Audiowide';
  font-size: clamp(10px, 1.8vw, 13px);
  letter-spacing: 2px;
  color: rgba(255,60,60,0.9);
  text-transform: uppercase;
  line-height: 1.6;
  text-shadow:
    0 0 10px rgba(255,26,26,0.8),
    0 0 20px rgba(255,26,26,0.5),
    0 0 40px rgba(255,26,26,0.3);
  animation: godPulse 2.5s ease-in-out infinite;
}
@keyframes godPulse {
  0%, 100% {
    text-shadow:
      0 0 10px rgba(255,26,26,0.8),
      0 0 20px rgba(255,26,26,0.5),
      0 0 40px rgba(255,26,26,0.3);
    color: rgba(255,60,60,0.9);
  }
  50% {
    text-shadow:
      0 0 15px rgba(255,26,26,1),
      0 0 30px rgba(255,26,26,0.8),
      0 0 60px rgba(255,26,26,0.5),
      0 0 80px rgba(255,0,0,0.3);
    color: rgba(255,100,100,1);
  }
}
.galatians-text em {
  color: #FF2222;
  font-style: normal;
}

/* DEATH TO DISCREPANCIES */
.death-divider {
  position: relative;
  z-index: 10;
  background: linear-gradient(135deg, rgba(255,26,26,0.06) 0%, rgba(2,4,8,0.98) 100%);
  border-top: 1px solid rgba(255,26,26,0.2);
  border-bottom: 1px solid rgba(255,26,26,0.2);
  padding: 40px 24px;
  text-align: center;
  overflow: hidden;
}
.death-divider::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 100% at 50% 50%, rgba(255,26,26,0.04) 0%, transparent 70%);
}
.death-title {
  font-family: 'Audiowide';
  font-size: clamp(20px, 4vw, 38px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--red);
  text-shadow: 0 0 30px rgba(255,26,26,0.5), 0 0 60px rgba(255,26,26,0.2);
  margin-bottom: 6px;
}
.death-sub {
  font-family: 'Share Tech Mono';
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--muted2);
  text-transform: uppercase;
}
